name: "AVbase"
base_url: https://www.avbase.net

detail:
  rules:
    - field: PublishNumber
      xpath:
        - //div[contains(@class, "container")]/div/div/img[@alt="fanza"]/following-sibling::span/text()
      add_to_context: true

    - field: PublishNumberDVD
      xpath:
        - //div[contains(@class, "container")]/div/div/img[@alt="fanza"]/following-sibling::span[not(contains(text(), "00"))]/text()
      add_to_context: true

    - field: DMMCid
      xpath: //div[contains(@class, "container")]/div/div/img[@alt="fanza"]/../span[@dir="rtl"]/text()
    - field: Title
      xpath: //div[@class="mt-4 mx-4 flex gap-2 md:col-start-1 md:col-end-3"]/a/h1/text()
    - field: OriginalTitle
      xpath: //div[@class="mt-4 mx-4 flex gap-2 md:col-start-1 md:col-end-3"]/a/h1/text()
    - field: Actors
      xpath: //div[contains(text(), "出演者・メモ")]/following-sibling::div//a/span/text()
      is_array: true
    - field: Outline
      xpath: //div[contains(text(), "紹介文")]/following-sibling::div/text()
    - field: OriginalActors
      xpath: //div[contains(text(), "出演者・メモ")]/following-sibling::div//a/span/text()
      is_array: true
    - field: Tags
      xpath: //div/span[contains(text(), "タグ・説明文")]/../following-sibling::div/div/a/text()
      is_array: true
    - field: Studio
      xpath: //div[contains(text(), "メーカー")]/following-sibling::div/a/text()
    - field: Publisher
      xpath: //div[contains(text(), "レーベル")]/following-sibling::div/a/text()
    - field: Director
      xpath: //div[contains(text(), "監督")]/following-sibling::div/a/text()
    - field: Series
      xpath: //div[contains(text(), "シリーズ")]/following-sibling::div/a/text()
    - field: Cover
      value:
        - https://awsimgsrc.dmm.com/dig/mono/movie/{PublishNumberDVD}/{PublishNumberDVD}pl.jpg
        - https://awsimgsrc.dmm.co.jp/pics_dig/digital/video/{PublishNumberDVD}/{PublishNumberDVD}pl.jpg
        - https://awsimgsrc.dmm.com/dig/mono/movie/{PublishNumber}/{PublishNumber}pl.jpg
        - https://awsimgsrc.dmm.co.jp/pics_dig/digital/video/{PublishNumber}/{PublishNumber}pl.jpg
      min_size: 30000
      xpath: //a[@class="md:grow"]/div/img/@src
      is_url: true

    - field: Poster
      value:
        - https://awsimgsrc.dmm.com/dig/mono/movie/{PublishNumberDVD}/{PublishNumberDVD}ps.jpg
        - https://awsimgsrc.dmm.co.jp/pics_dig/digital/video/{PublishNumberDVD}/{PublishNumberDVD}ps.jpg
        - https://awsimgsrc.dmm.com/dig/mono/movie/{PublishNumberDVD}/{PublishNumber}ps.jpg
        - https://awsimgsrc.dmm.co.jp/pics_dig/digital/video/{PublishNumberDVD}/{PublishNumber}ps.jpg
      min_size: 30000
      is_url: true

    - field: ExtraFanart
      xpath: //div[contains(@class, "flex-none")]/a[contains(@rel, "noopener noreferrer")]/@href
      is_array: true
      is_url: true
    - field: Release
      xpath: //div[contains(text(), "発売日")]/following-sibling::div/a/text()
      processes:
        - type: date
          format: "%Y/%m/%d"
    - field: Runtime
      xpath: //div[contains(text(), "収録分数")]/following-sibling::div/text()

search:
  url: "/works?q={number}"
  detail_xpath: //div[contains(@class, 'cl-container')]//div[@class='grid sm:grid-cols-2 gap-4']//a[contains(@class, 'text-md font-bold btn-ghost')]/@href
